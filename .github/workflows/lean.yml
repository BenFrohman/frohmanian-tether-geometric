# Author: Benjamin Stanley Frohman
# Kernel check of the FrohmanianTether library and its axiom audit.
# A green run means the stated Lean propositions follow from the stated definitions
# using only propext, Classical.choice and Quot.sound. It is not a proof of
# Navier-Stokes regularity or of any geometric claim beyond those propositions.
name: Lean build and axiom audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          cat lean-toolchain
          lean --version
          lake --version
      - name: No sorry / admit / native_decide / axiom declarations (comments excluded; every module must be in the strict audit)
        run: python3 scripts/check_forbidden_tokens.py --require-imported-by scripts/StrictAxiomAudit.lean FrohmanianTether.lean FrohmanianTether
      - name: Mathlib cache
        run: lake exe cache get
      - name: Build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          if grep -n "declaration uses 'sorry'" build.log; then echo "sorry in build"; exit 1; fi
      - name: Existing theorem audit (scripts/AxiomAudit.lean)
        run: |
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee axioms.txt
          if grep -qE 'sorryAx|ofReduceBool|error:' axioms.txt; then exit 1; fi
          grep -q 'nonstandard axioms: 0 ' axioms.txt
      - name: Strict whole-library axiom audit (every declaration)
        run: |
          set -o pipefail
          lake env lean scripts/StrictAxiomAudit.lean 2>&1 | tee strict-axiom-audit.txt
          grep -q '^STRICT AUDIT PASS' strict-axiom-audit.txt
          if grep -v '^STRICT AUDIT PASS' strict-axiom-audit.txt | grep -qE 'STRICT AUDIT FAIL|sorryAx|ofReduceBool|error:'; then exit 1; fi
          grep '^STRICT AUDIT SUMMARY' strict-axiom-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: lean-logs-${{ github.event_name }}-${{ github.run_id }}
          path: |
            build.log
            axioms.txt
            strict-axiom-audit.txt
          if-no-files-found: warn
